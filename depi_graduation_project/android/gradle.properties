# JVM args — adjust based on your machine
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError

# AndroidX
android.useAndroidX=true
android.enableJetifier=true

# Optional: Force Gradle to use the correct drive for temp/cache (Windows)
org.gradle.daemon=true

kotlin.incremental=false
